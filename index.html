<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO and OpenGraph Meta Tags -->
    <meta
      name="description"
      content="Weatherly - A modern weather dashboard for real-time updates and 5-day forecasts for any city."
    />
    <meta
      name="keywords"
      content="weather, dashboard, react, forecast, city weather, weatherly"
    />
    <meta name="author" content="zeropse" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://weatherly.zeropse.org/" />
    <meta property="og:title" content="Weatherly" />
    <meta
      property="og:description"
      content="Get real-time weather updates and a detailed 5-day forecast for any city around the globe."
    />
    <meta
      property="og:image"
      content="https://weatherly.zeropse.org/og-image.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://weatherly.zeropse.org/" />
    <meta property="twitter:title" content="Weatherly" />
    <meta
      property="twitter:description"
      content="Get real-time weather updates and a detailed 5-day forecast for any city around the globe."
    />
    <meta
      property="twitter:image"
      content="https://weatherly.zeropse.org/og-image.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Weatherly - Real-time Weather Updates</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
